name: E2E (self-hosted)

# Full Detox E2E suite on the self-hosted KVM runner (openCairnRunner).
# Codifies the manual headless recipe proven on 2026-07-11:
#   hermetic docker backend (postgis + backend + seed on host :5102)
#   + headless emulator (swiftshader) + detox build/test.
#
# HUMAN-GATED on purpose. This suite runs on a self-hosted box with Docker,
# KVM and a backend deploy key on it, so it must never fire automatically off
# a PR — that would hand arbitrary PR code (including from a fork) a shell on
# the runner. It runs only when a maintainer asks for it, two ways:
#
#   1. Add the `run-e2e` label to a PR  -> runs against that PR's merge ref.
#      Remove and re-add the label to run it again.
#   2. Actions tab -> "Run workflow"    -> runs against a branch you pick.
#
# Later this becomes the RELEASE gate (see plan WS1b / WS3); fast CRUD tests
# are the PR gate and run hosted, not here.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
    branches: [main]

# Least-privilege GITHUB_TOKEN: this job only checks out code and runs tests on
# a self-hosted box — it never writes to the repo. Deny everything except read,
# so a compromised step can't push, open PRs, or mint packages with the token.
permissions:
  contents: read

# One E2E run at a time — the box has a single emulator lane (16GB / one KVM).
concurrency:
  group: e2e-self-hosted
  cancel-in-progress: false

env:
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk
  AVD_NAME: Medium_Phone_API_36.1
  DETOX_CONFIG: android.emu.debug
  # Seed creds are throwaway values baked into the hermetic test DB — NOT real
  # secrets. They must match seed.js (SEED_EMAIL / SEED_PASSWORD) in the stack.
  TEST_EMAIL: test@opencairn.xyz
  TEST_PASSWORD: TestPass1!

jobs:
  e2e:
    # The `pull_request: types: [labeled]` trigger fires for EVERY label, so gate
    # on the specific one. Without this, any label added to any PR would start a
    # run on the self-hosted box.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-e2e'
    # MUST run on the HOST runner (openCairnRunner), which has direct /dev/kvm +
    # docker. The 'host-kvm' label is unique to it — this keeps the job off the
    # pre-existing containerized runner (no KVM, bind-mounted docker) that shares
    # the default self-hosted/linux/x64 labels.
    runs-on: [self-hosted, host-kvm]
    timeout-minutes: 60
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          # Self-hosted workspaces are NOT wiped between jobs. The default
          # (persist-credentials: true) leaves the job's GITHUB_TOKEN sitting in
          # .git/config on the box after the run, readable by anything that lands
          # there later. Nothing here pushes, so drop it.
          persist-credentials: false

      - name: Put Android SDK tools on PATH
        run: |
          echo "$ANDROID_HOME/platform-tools"       >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator"             >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # env.ts + .env are gitignored / per-machine — regenerate them for the
      # clean checkout. TARGET=local => API_BASE=10.0.2.2:5102 (host from the
      # emulator). OFFLINE_API_BASE stays :5101 (the app's offline sentinel),
      # so the test target (:5102) stays distinct and actually hits the stack.
      - name: Materialize gitignored config (env.ts + .env)
        run: |
          cat > NodeMobile/src/config/env.ts <<'EOF'
          // GENERATED IN CI — do not commit
          // CI always uses 'local' (the hermetic docker stack). dev/prod are
          // placeholders here — the real addresses live in the gitignored
          // env.ts on dev machines and must NOT be committed to this public repo.
          const TARGET = 'local';
          const SERVERS = {
            dev:  'http://127.0.0.1:5101',
            prod: 'https://api.opencairn.xyz',
            local: 'http://10.0.2.2:5102',
          } as const;
          export const API_BASE = SERVERS[TARGET];
          console.log('[env] API_BASE =', API_BASE);
          export const OFFLINE_API_BASE = "http://10.0.2.2:5101";
          export const PMTILES_BASE = "http://127.0.0.1:5200";
          EOF
          printf 'TEST_EMAIL=%s\nTEST_PASSWORD=%s\n' "$TEST_EMAIL" "$TEST_PASSWORD" > NodeMobile/.env

      # Fresh clone of the backend stack each run (hermetic). Uses the runner's
      # on-disk SSH key (cairn_admin owns it, it's registered on GitHub) — no
      # key material in Secrets. Pin to docker-test-stack until it merges to main.
      - name: Bring up hermetic backend (postgis + backend + seed)
        env:
          BACKEND_SSH_KEY: ${{ secrets.BACKEND_SSH_KEY }}
        run: |
          rm -rf backend-stack
          # Write the deploy key from Actions secrets to a temp file — HOME/user
          # independent (the runner service's HOME is unreliable for reading
          # ~/.ssh). Clones the private backend repo over SSH.
          install -m 700 -d "$RUNNER_TEMP/ssh"
          umask 077
          printf '%s\n' "$BACKEND_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          # Host keys straight from GitHub's own API over TLS, instead of the old
          # StrictHostKeyChecking=no. Blindly accepting any host key while handing
          # over a deploy key means anything that can answer for github.com on this
          # network gets the key offered to it. Falls back to accept-new (TOFU) only
          # if the metadata fetch fails, which is still strictly better than 'no'.
          KNOWN_HOSTS="$RUNNER_TEMP/ssh/known_hosts"
          if curl -fsS --max-time 20 https://api.github.com/meta \
               | tr '{},' '\n\n\n' | grep -oE '"(ssh-|ecdsa-)[A-Za-z0-9+/= -]+"' \
               | tr -d '"' | sed 's/^/github.com /' > "$KNOWN_HOSTS" \
             && [ -s "$KNOWN_HOSTS" ]; then
            SSH_HOSTKEY_OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS"
            echo "pinned $(wc -l < "$KNOWN_HOSTS") github.com host keys from api.github.com"
          else
            SSH_HOSTKEY_OPTS="-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$KNOWN_HOSTS"
            echo "WARN: could not fetch GitHub host keys; falling back to accept-new"
          fi
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/ssh/key -o IdentitiesOnly=yes $SSH_HOSTKEY_OPTS" \
            git clone --depth 1 --branch docker-test-stack \
            git@github.com:Dennis-Smith414/OpenCairnDatabase.git backend-stack
          cd backend-stack
          # If the backend crashes on boot (e.g. a migration error) the seed's
          # depends_on makes `up` exit non-zero — dump the backend log so we see why.
          docker compose up -d --build || {
            echo "::group::docker compose up failed — backend container logs"
            docker compose logs backend
            echo "::endgroup::"
            docker compose logs db | tail -30
            exit 1
          }
          echo "Waiting for backend health on :5102 ..."
          for i in $(seq 1 40); do
            if curl -sf http://localhost:5102/api/health >/dev/null; then
              echo "backend healthy"; break
            fi
            sleep 3
            # Scoped to the two services on purpose: a bare `docker compose logs`
            # dumps every container's startup output — including anything the db
            # echoes about its connection string — straight into a build log and
            # then into an uploaded artifact.
            [ "$i" = "40" ] && {
              echo "backend never became healthy"
              docker compose logs --tail=100 --no-color backend
              docker compose logs --tail=30 --no-color db
              exit 1
            }
          done
          # seed is one-shot; run it explicitly so we don't race the detached
          # `up`. Idempotent (201 created / 409 already-exists both OK).
          docker compose run --rm seed

      # The AVD MUST use the `medium_phone` profile (1080x2400). The `pixel`
      # profile (1080x1920) clips the delete button so Detox's 75%-visible tap
      # constraint fails. --force recreates it correctly no matter what's already
      # on the box — codifies the profile instead of a manual one-off.
      - name: Create/refresh AVD (medium_phone profile)
        run: |
          echo "no" | avdmanager create avd --force \
            -n "$AVD_NAME" \
            -k "system-images;android-36;google_apis;x86_64" \
            -d medium_phone

      - name: Boot headless emulator
        run: |
          adb start-server
          # -memory 4096: a stock avdmanager AVD defaults to ~1.5GB guest RAM,
          # which the guest OOM-killer uses to reap the heavy RN app on launch
          # (esp. with docker+Metro+Gradle sharing the box). Give it real RAM.
          nohup emulator -avd "$AVD_NAME" \
            -no-window -no-audio -no-snapshot -no-boot-anim -memory 4096 \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          echo "Waiting for sys.boot_completed ..."
          for i in $(seq 1 60); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              echo "boot complete"; break
            fi
            sleep 3
            [ "$i" = "60" ] && { echo "emulator never booted"; cat "$RUNNER_TEMP/emulator.log"; exit 1; }
          done
          # userdebug root so the tests can mkdir under scoped storage before adb
          # push. `adb root` restarts adbd and the reconnect often races right
          # after boot ("unable to connect for root: closed"); retry until it sticks.
          for i in $(seq 1 10); do
            adb root && break
            echo "adb root not ready (attempt $i), retrying ..."
            sleep 3
            [ "$i" = "10" ] && { echo "adb root never connected"; exit 1; }
          done
          adb wait-for-device
          # kill Detox timing flake
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          # Suppress ANR/crash system dialogs. Under load the cold-start ANR pops
          # an "isn't responding" dialog that GRABS WINDOW FOCUS — Detox then fails
          # with "Waited for the root of the view hierarchy to have window focus"
          # even though the app UI is drawn behind it. Hiding the dialog lets the
          # app keep/regain focus so Espresso can proceed.
          adb shell settings put global hide_error_dialogs 1 || true
          # keep the screen awake so doze/screen-off can't drop window focus mid-suite
          adb shell svc power stayon true || true
          # fresh AVD can boot to a locked screen that hides the app
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true
          # bigger logcat buffer so a startup crash isn't lost to buffer roll
          adb logcat -G 16M || true

      - name: Install JS deps
        run: cd NodeMobile && npm ci

      - name: Detox build
        run: cd NodeMobile && npx detox build -c "$DETOX_CONFIG"

      # Metro is started HERE, in the same step as detox — a background process
      # from an earlier step can be reaped before a later step uses it, leaving
      # the debug app unable to load its JS bundle (blank screen, no landing
      # button). Wait for Metro to actually answer, then run the suite.
      - name: Detox test (Metro co-located)
        run: |
          cd NodeMobile
          nohup npx react-native start > "$RUNNER_TEMP/metro.log" 2>&1 &
          echo "Waiting for Metro to answer ..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/status | grep -q "packager-status:running"; then
              echo "Metro is up"; break
            fi
            sleep 2
            [ "$i" = "30" ] && { echo "Metro never came up"; cat "$RUNNER_TEMP/metro.log"; exit 1; }
          done
          # route the emulator's :8081 to host Metro for the JS bundle
          adb reverse tcp:8081 tcp:8081 || true
          # Warm the app before the suite. The cold first launch under swiftshader
          # (software GL = CPU-bound rendering) races Metro's first bundle transform
          # (also CPU-bound) → main-thread starvation → ANR on launchApp, which then
          # cascades into the next spec. Kill that race in two stages:
          #   1) Pre-transform the JS bundle by fetching it straight from Metro. This
          #      blocks until Metro has fully built + cached the bundle, so the app's
          #      first launch no longer competes with the transform.
          #   2) THEN launch the app once to warm swiftshader GL, settle, force-stop.
          echo "Pre-building the JS bundle from Metro (avoids the launch-vs-transform CPU race) ..."
          curl -s --max-time 300 \
            "http://localhost:8081/index.bundle?platform=android&dev=true&minify=false" \
            -o "$RUNNER_TEMP/warm.bundle" \
            && echo "bundle built ($(wc -c < "$RUNNER_TEMP/warm.bundle") bytes)" \
            || echo "WARN: bundle prefetch failed, continuing"
          echo "Warming swiftshader graphics with a real launch ..."
          adb shell monkey -p com.nodemobile -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1 || true
          sleep 40
          adb shell am force-stop com.nodemobile || true
          # Capture the whole device log for the run so a startup crash survives,
          # then surface the crash lines INLINE in this step (no artifact hunt).
          mkdir -p "$RUNNER_TEMP/diag"
          adb logcat -c || true
          adb logcat > "$RUNNER_TEMP/diag/full-logcat.txt" 2>&1 &
          LOGCAT_PID=$!
          set +e
          npx detox test -c "$DETOX_CONFIG" --headless --record-logs all
          DETOX_EXIT=$?
          set -e
          kill "$LOGCAT_PID" 2>/dev/null || true
          echo "==================== com.nodemobile crash lines ===================="
          grep -iE "FATAL|AndroidRuntime|SIGSEGV|SIGABRT|lowmemorykiller|libc :|hermes|com\.nodemobile" \
            "$RUNNER_TEMP/diag/full-logcat.txt" | tail -80 || true
          echo "===================================================================="
          exit $DETOX_EXIT

      - name: Collect on-device diagnostics (on failure)
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          adb shell screencap -p /sdcard/screen.png && adb pull /sdcard/screen.png "$RUNNER_TEMP/diag/screen.png" || true
          adb logcat -d > "$RUNNER_TEMP/diag/logcat.txt" || true
          echo "--- Metro tail ---"; tail -n 40 "$RUNNER_TEMP/metro.log" || true
          # What the app's HTTP calls actually did. Answers "did the request reach
          # the backend, and what did it return?" — the question a UI timeout
          # can't. Must run BEFORE the teardown step drops the stack.
          if [ -d backend-stack ]; then
            echo "::group::backend request log (last 200 lines)"
            (cd backend-stack && docker compose logs --tail=200 --no-color backend) || true
            echo "::endgroup::"
            (cd backend-stack && docker compose logs --no-color backend > "$RUNNER_TEMP/diag/backend.log") || true
          fi
          # Per-test Detox artifacts: screenshot + view hierarchy + logcat for the
          # failing test only. List them so the artifact bundle is easy to navigate.
          echo "--- Detox artifacts ---"; ls -R NodeMobile/artifacts 2>/dev/null | head -60 || true

      - name: Tear down backend stack
        if: always()
        run: |
          if [ -d backend-stack ]; then cd backend-stack && docker compose down -v || true; fi

      - name: Kill emulator + Metro
        if: always()
        run: |
          adb -s emulator-5554 emu kill || true
          pkill -f "react-native start" || true
          pkill -f qemu-system || true

      # The deploy key is a real credential for a private repo. Nothing was
      # removing it, so it sat in cleartext on the runner until some later job
      # happened to reuse RUNNER_TEMP. Shred it explicitly, on every path.
      - name: Destroy the deploy key
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ssh/key" ]; then
            shred -u "$RUNNER_TEMP/ssh/key" 2>/dev/null || rm -f "$RUNNER_TEMP/ssh/key"
          fi
          rm -rf "$RUNNER_TEMP/ssh"

      - name: Upload artifacts (screens/logs on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          # NodeMobile/artifacts must match artifacts.rootDir in .detoxrc.js, and
          # must NOT be a dotdir — upload-artifact@v4 silently skips hidden files,
          # which is why every screenshot/hierarchy was missing from past runs.
          path: |
            NodeMobile/artifacts
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/metro.log
            ${{ runner.temp }}/diag
          if-no-files-found: ignore
          # logcat and the backend request log can carry the test user's JWT and
          # request bodies. Throwaway creds, but there's no reason to keep them
          # for 90 days — and anyone with read access to the repo can download them.
          retention-days: 7
